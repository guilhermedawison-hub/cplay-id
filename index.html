<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPlay | Identificação</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f8;font-family:Arial,sans-serif;color:#111}.card{text-align:center;background:#fff;border:1px solid #e8e8eb;border-radius:20px;padding:42px 28px;width:min(90%,420px);box-shadow:0 12px 40px rgba(0,0,0,.06)}.brand{font-size:18px;font-weight:800;letter-spacing:2px}.label{margin-top:28px;font-size:12px;color:#777;text-transform:uppercase;letter-spacing:1.5px}.code{font-size:42px;font-weight:800;margin:8px 0 22px}.status{display:inline-block;padding:9px 14px;border-radius:999px;background:#f1f1f3;font-size:12px;font-weight:700;letter-spacing:.5px}</style></head><body><main class="card"><div class="brand">CPLAY</div><div class="label">Identificação da placa</div><div class="code" id="code">---</div><div class="status">PLACA NÃO ATIVADA</div></main><script>const raw=location.pathname.replace(/^\/+|\/+$/g,'').toLowerCase();const code=/^cp-\d{5}$/.test(raw)?raw:'código inválido';document.getElementById('code').textContent=code;document.title=code==='código inválido'?'CPlay | Identificação':'CPlay | '+code;</script></body></html>
